name: Ping Backend (Keep-Alive)

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spin down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Pinging https://threew-vu4v.onrender.com/api/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://threew-vu4v.onrender.com/api/health)
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ping successful."
          else
            echo "Ping returned non-200 status, but request was sent."
          fi
